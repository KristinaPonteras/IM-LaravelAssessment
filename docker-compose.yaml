services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-api-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel-test

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: laravel-api-web
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - laravel-test

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel-test

networks:
  laravel-test:
    driver: bridge

volumes:
  mysql-data:
    driver: local
