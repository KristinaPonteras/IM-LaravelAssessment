# Development overrides — merged automatically by `docker compose up`.
# Source code is bind-mounted so edits are live; opcache revalidates.
services:
  app-new:
    build:
      target: development
    env_file:
      - .env
    volumes:
      - ./:/var/www/html

  web-new:
    ports:
      - "8000:80"
    volumes:
      # Serve live public/ assets and config without rebuilding the image.
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db-new:
    # Expose MySQL to the host for local GUI tools (TablePlus, DBeaver, ...).
    ports:
      - "3307:3306"
